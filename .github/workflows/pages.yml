name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.netlify' \
            --exclude '.tools' \
            --exclude 'supabase' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.zip' \
            --exclude 'README.md' \
            --exclude 'vercel.json' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
